name: 'VirusTotal Scan'

permissions:
  contents: write

on:
  release:
    types: [published]

jobs:
  virustotal:
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v4

      - name: 'VirusTotal Scan'
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            ^Openmail.*$

          # add VirusTotal report in release note.
          update_release_body: true
